spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/queueease}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
app.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-123456}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:uploads}

# Staff account created on first start. Change the password before going live.
app.staff.username=${STAFF_USERNAME:staff}
app.staff.password=${STAFF_PASSWORD:staff123}
